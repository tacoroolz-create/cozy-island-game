<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Island 3D 🏝️</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #2c1810;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100vw; height: 100vh;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            text-shadow: 1px 1px 0 #000;
        }
        #top-bar, #bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }
        #bottom-bar { align-items: flex-end; }
        .panel {
            background: rgba(44, 24, 16, 0.78);
            border: 2px solid #d4a373;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            line-height: 1.4;
            min-width: 140px;
        }
        .panel h2 { font-size: 16px; margin-bottom: 4px; color: #ffe4b5; }
        #prompt {
            color: #ffd700;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #prompt.visible { opacity: 1; }
        #inventory-bar {
            display: flex;
            gap: 6px;
        }
        .slot {
            width: 44px; height: 44px;
            background: rgba(44, 24, 16, 0.85);
            border: 2px solid #d4a373;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .slot img { width: 32px; height: 32px; image-rendering: pixelated; }
        .slot .qty {
            position: absolute; bottom: 2px; right: 4px;
            font-size: 12px; color: #fff;
        }
        #menu {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(44, 24, 16, 0.94);
            border: 3px solid #d4a373;
            border-radius: 12px;
            padding: 24px 32px;
            display: none;
            pointer-events: auto;
            min-width: 280px;
        }
        #menu.visible { display: block; }
        #menu h1 { font-size: 20px; color: #ffe4b5; margin-bottom: 12px; }
        #menu p { margin: 6px 0; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div id="top-bar">
                <div class="panel">
                    <h2>Cozy Island 3D</h2>
                    <div id="clock">Day 1 — 6:00 AM</div>
                    <div id="season">Sweet Valley</div>
                </div>
                <div class="panel" id="prompt">Press Space to interact</div>
            </div>
            <div id="bottom-bar">
                <div id="inventory-bar"></div>
                <div class="panel">
                    <div>WASD / Arrows — move</div>
                    <div>Mouse — camera</div>
                    <div>Space — interact</div>
                    <div>E — menu</div>
                </div>
            </div>
        </div>
        <div id="menu">
            <h1>Menu</h1>
            <p>Inventory and settings will live here.</p>
            <p>Press <strong>E</strong> to close.</p>
        </div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
